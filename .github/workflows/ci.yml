name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**', 'claude/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, ldap, zip
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
      - run: php bin/console lint:container
      - run: php bin/console lint:yaml config --parse-tags
      - run: php bin/console doctrine:migrations:migrate --no-interaction
      - run: php bin/console doctrine:schema:validate
      - run: php bin/phpunit

  frontend:
    name: Frontend (Nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docs:
    name: Docs (Nuxt Content)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run generate

  images:
    name: Docker image (${{ matrix.component }})
    needs: [backend, frontend]
    # Built on every run (pull requests included, to catch Dockerfile breakage before merging);
    # published to ghcr.io only for the long-lived gitflow branches and version tags.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      matrix:
        include:
          - component: api
            context: backend
          - component: front
            context: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed by git describe (version of the build).
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.PUBLISH == 'true' && steps.meta.outputs.tags || format('rocket-print-{0}:ci', matrix.component) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Smoke test (api)
        if: env.PUBLISH != 'true' && matrix.component == 'api'
        run: |
          docker run --rm -e APP_SECRET=ci -e JWT_PASSPHRASE=ci rocket-print-api:ci php bin/console about
          docker run -d --name api -p 8080:80 -e APP_SECRET=ci -e JWT_PASSPHRASE=ci rocket-print-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/docs.jsonopenapi -o /dev/null && break; sleep 2; done
          curl -fsS http://localhost:8080/api/docs.jsonopenapi | grep -qF '\/api\/users'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/users)" = 401
          # __SMOKE_API__
      - name: Smoke test (front)
        if: env.PUBLISH != 'true' && matrix.component == 'front'
        run: |
          docker run -d --name front -p 3000:3000 rocket-print-front:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login -o /dev/null && break; sleep 1; done
          curl -fsSI http://localhost:3000/login | grep -i "content-security-policy: frame-ancestors 'none'"

  demo:
    name: Demo environment (compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f compose.yaml -f compose.demo.yaml
      # Version written in the images (build argument).
      APP_VERSION: v0.0.0-ci
      FRONT: http://localhost:3300
      DOCS: http://localhost:3301
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo stack
        run: |
          $COMPOSE up -d --build
          test "$(docker wait "$($COMPOSE ps -aq demo-seed)")" = 0
          for i in $(seq 1 60); do curl -fsS $FRONT/login -o /dev/null && exit 0; sleep 2; done
          echo "Front never became ready" && exit 1
      - name: Check demo scenarios
        run: |
          set -x
          # Seeded accounts: the first-run setup is closed
          curl -fsS $FRONT/api/setup | jq -e '.required == false'
          # Local account (through the front's same-origin /api proxy, as in Codespaces)
          ALICE=$(curl -fsS -X POST $FRONT/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"alice@example.org","password":"demo-alice-password"}' | jq -r .token)
          # LDAP account, admin through its directory group
          TOKEN=$(curl -fsS -X POST $FRONT/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"marie.martin@example.org","password":"password"}' | jq -r .token)
          curl -fsS $FRONT/api/me -H "Authorization: Bearer $TOKEN" | jq -e '.roles | index("ROLE_ADMIN")'
          # Version of the images, shown by the API and the interface; no one-click update without UPDATER_TOKEN
          curl -fsS $FRONT/api/system/version -H "Authorization: Bearer $TOKEN" | jq -e '.version == "0.0.0-ci"'
          curl -fsS $FRONT/api/system/update -H "Authorization: Bearer $TOKEN" | jq -e '.current.release == "0.0.0-ci" and .method == "manual" and .methods.docker.configured == false'
          curl -fsS $FRONT/login | grep -q 'appVersion:"v0.0.0-ci"'
          # LDAP settings (environment until saved): the connection test finds the directory's users
          curl -fsS $FRONT/api/ldap/config -H "Authorization: Bearer $TOKEN" | jq -e '.source == "environment" and .enabled'
          curl -fsS -X POST $FRONT/api/ldap/test -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            | jq -e '.ok and .count >= 2'
          # Documentation site, with the changelog
          curl -fsS $DOCS/changelog | grep -q 'Dernière version'
          # Network health checks (also run by the worker's scheduler): the real OpenLDAP
          curl -fsS -X POST $FRONT/api/health/check -H "Authorization: Bearer $TOKEN" \
            | jq -e '[.services[] | select(.id == "ldap") | .status] == ["operational"]'
          $COMPOSE exec -T api php bin/console app:health:check
          # Dashboard: the whole platform and service details for admins
          curl -fsS $FRONT/api/dashboard -H "Authorization: Bearer $TOKEN" \
            | jq -e '.scope == "platform" and (.daily | length) == 30 and ([.health.services[] | select(.id == "database" or .id == "ldap") | .status] == ["operational", "operational"])'
          # An application acts as a user, never as an administrator
          DEMO_TOKEN=$(grep -o 'rpa_demo_[a-z_]*' compose.demo.yaml | head -1)
          curl -fsS $FRONT/api/me -H "Authorization: Bearer $DEMO_TOKEN" -H 'X-Impersonate-User: admin@example.org' \
            | jq -e '.user.email == "admin@example.org" and (.roles | index("ROLE_ADMIN") | not)'
          # __DEMO_SCENARIOS__
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=80
