# Demo print server of Rocket Print (compose.demo.yaml): a Samba "printer" that files what it receives
# under /printed instead of printing it. Account: demo / demo-print-password.
[global]
   workgroup = WORKGROUP
   server string = Rocket Print demo print server
   server role = standalone server
   server min protocol = SMB2
   map to guest = never
   log level = 1
   # No CUPS: the "print command" below does the printing. The printcap file lists the printer shares
   # (without it, Samba refuses the jobs with WERR_INTERNAL_DB_CORRUPTION).
   printing = bsd
   printcap name = /etc/samba/printcap
   load printers = no
   disable spoolss = yes

[demo-printer]
   comment = Laser 2e étage (démo)
   path = /var/spool/samba
   printable = yes
   guest ok = no
   valid users = demo
   # %s: the spooled file, moved to /printed under a unique name (the shell PID: copies share the job name).
   print command = mv %s /printed/job-$$
   lpq command = /bin/true
   lprm command = /bin/true
